<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Ledger with Email Auth & Role Control</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 10px; max-width: 800px; margin: auto; background-color: #f4f6f9; box-sizing: border-box; }
    .box { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto; }
    h2, h3 { color: #333; font-size: 1.3em; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .btn-deposit { background-color: #28a745; }
    .btn-deposit:hover { background-color: #218838; }
    .btn-withdraw { background-color: #dc3545; }
    .btn-withdraw:hover { background-color: #c82333; }
    .btn-edit { background-color: #ffc107; color: #333; padding: 6px 10px; width: auto; font-size: 0.8em; }
    .btn-edit:hover { background-color: #e0a800; }
    .btn-filter { background-color: #17a2b8; width: 48%; display: inline-block; }
    .btn-filter:hover { background-color: #138496; }
    .btn-reset { background-color: #6c757d; width: 48%; display: inline-block; }
    .btn-reset:hover { background-color: #5a6268; }
    .balance-card { background: #e9ecef; padding: 12px; border-radius: 6px; text-align: center; font-size: 1.1em; font-weight: bold; margin: 10px 0; }
    
    /* Responsive Table Container */
    .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 550px; }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; font-size: 0.85em; word-break: break-word; }
    th { background-color: #f8f9fa; color: #333; }
    tfoot tr { background-color: #e9ecef; font-weight: bold; }
    
    /* Pagination Styling */
    .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    .pagination-container button { width: auto; padding: 8px 15px; margin: 0; font-size: 0.9em; }
    .pagination-container button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #page-info { font-size: 0.9em; font-weight: bold; color: #555; }

    .hidden { display: none; }
    .logout-btn { background-color: #6c757d; width: auto; padding: 6px 12px; float: right; font-size: 0.9em; }
    .admin-section { border: 2px dashed #007bff; background-color: #eef6ff; }
    .filter-container { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
    .date-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
    .date-inputs div { flex: 1; min-width: 140px; }
    .date-inputs label { font-size: 0.85em; font-weight: bold; color: #555; }
  </style>
</head>
<body>

  <!-- LOGIN FORM -->
  <div id="login-box" class="box">
    <h3>System Login (Updated)</h3>
    <input type="email" id="login-email" placeholder="Email Address">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="loginUser()">Login</button>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="box">
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
      <h2>Personal Account Ledger</h2>
      <p>Logged in User: <span id="user-email-display" style="font-weight: bold;"></span> (<span id="user-role-display" style="color:#007bff; font-weight:bold;"></span>)</p>
    </div>

    <!-- ADMIN ONLY SECTION: CREATE NEW USER -->
    <div id="admin-create-box" class="box admin-section hidden">
      <h3>➕ Add New User (Admin Only)</h3>
      <input type="email" id="reg-email" placeholder="User Email Address">
      <input type="password" id="reg-password" placeholder="Set Password (min 6 chars)">
      <select id="reg-role">
        <option value="staff">Staff (Cannot edit history or create users)</option>
        <option value="admin">Admin (Full access)</option>
      </select>
      <button onclick="registerUserByAdmin()" style="background-color: #28a745;">Create User</button>
    </div>

    <!-- 1. Add New Customer Form -->
    <div class="box">
      <h3>Add New Account</h3>
      <input type="text" id="customer-name" placeholder="Account Holder Name">
      <input type="text" id="customer-phone" placeholder="Mobile Number">
      <button onclick="addCustomer()">Save New Account Holder</button>
    </div>

    <!-- 2. Transaction & Account Management -->
    <div class="box">
      <h3>Perform Transaction</h3>
      <label for="customer-select">Select Account Holder:</label>
      <select id="customer-select" onchange="loadCustomerData()">
        <option value="">-- Select Account --</option>
      </select>

      <div id="customer-details" style="display:none;">
        <div class="balance-card">
          Current Balance: <span id="current-balance" style="color:#28a745;">0</span> BDT
        </div>

        <!-- Custom Date Selection Field -->
        <label for="txn-date" style="font-size: 0.85em; font-weight: bold; color: #555;">Transaction Date & Time:</label>
        <input type="datetime-local" id="txn-date">

        <input type="number" id="txn-amount" placeholder="Amount (e.g., 500)">
        <input type="text" id="txn-note" placeholder="Remarks / Note (e.g., Cash Deposit)">

        <div style="display: flex; gap: 10px;">
          <button class="btn-deposit" onclick="handleTransaction('deposit')">জমা(+)</button>
          <button class="btn-withdraw" onclick="handleTransaction('withdraw')">খরচ(-)</button>
        </div>

        <h4>Collection History & Report</h4>
        
        <!-- DATE RANGE FILTER -->
        <div class="filter-container">
          <div class="date-inputs">
            <div>
              <label for="filter-start-date">From Date:</label>
              <input type="date" id="filter-start-date">
            </div>
            <div>
              <label for="filter-end-date">To Date:</label>
              <input type="date" id="filter-end-date">
            </div>
          </div>
          <div style="margin-top: 5px;">
            <button class="btn-filter" onclick="applyDateFilter()">Filter Report</button>
            <button class="btn-reset" onclick="resetDateFilter()">Reset</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Amount</th>
                <th>Balance</th>
                <th>Remarks</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <!-- Dynamic rows -->
            </tbody>
            <tfoot id="history-footer">
              <!-- Subtotal calculations -->
            </tfoot>
          </table>
        </div>

        <!-- PAGINATION CONTROLS -->
        <div class="pagination-container">
          <button id="prev-btn" onclick="changePage(-1)">Previous</button>
          <span id="page-info">Page 1 of 1</span>
          <button id="next-btn" onclick="changePage(1)">Next</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, push, update, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAgEiJJHwtdhd4QzZRonoyHEwmz1vjYN-U",
      authDomain: "shifat30373transaction.firebaseapp.com",
      databaseURL: "https://shifat30373transaction-default-rtdb.firebaseio.com",
      projectId: "shifat30373transaction",
      storageBucket: "shifat30373transaction.firebasestorage.app",
      messagingSenderId: "38889296928",
      appId: "1:38889296928:web:427556520b470b71ccd845",
      measurementId: "G-ZDZ471PKXE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentRole = "staff";
    let currentUser = null;

    // Pagination Variables
    let allFilteredTransactions = [];
    let currentPage = 1;
    const rowsPerPage = 5;

    // Helper: Set input to current local datetime
    function setDefaultTxnDate() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("txn-date").value = now.toISOString().slice(0, 16);
    }

    // Listen to Auth State
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const userRef = ref(db, 'users/' + user.uid);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          currentRole = snapshot.val().role || "staff";
          showDashboard(user.email, currentRole);
        } else {
          const usersRef = ref(db, 'users');
          const allUsersSnap = await get(usersRef);

          let assignedRole = allUsersSnap.exists() ? "staff" : "admin";
          await set(userRef, {
            email: user.email,
            role: assignedRole,
            createdAt: Date.now()
          });
          currentRole = assignedRole;
          showDashboard(user.email, currentRole);
        }
      } else {
        currentUser = null;
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login-box").classList.remove("hidden");
      }
    });

    // ১. লগইন প্রসেস (Email & Password)
    window.loginUser = async () => {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();

      if (!email || !password) {
        alert("Please enter both email address and password!");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        alert("Login Error: " + e.message);
      }
    };

    // ২. অ্যাডমিন দ্বারা নতুন ইউজার রেজিস্টার প্রসেস
    window.registerUserByAdmin = async () => {
      if (currentRole !== "admin") {
        alert("Permission denied! Only Admin can create new users.");
        return;
      }

      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value.trim();
      const role = document.getElementById("reg-role").value;

      if (!email || !password) {
        alert("Please fill in all fields!");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters!");
        return;
      }

      try {
        const tempApp = initializeApp(firebaseConfig, "SecondaryApp");
        const tempAuth = getAuth(tempApp);
        const userCredential = await createUserWithEmailAndPassword(tempAuth, email, password);
        const newUser = userCredential.user;

        await set(ref(db, 'users/' + newUser.uid), {
          email: email,
          role: role,
          createdAt: Date.now()
        });

        alert(`New User (${email}) with role [${role.toUpperCase()}] created successfully!`);
        document.getElementById("reg-email").value = "";
        document.getElementById("reg-password").value = "";
        
        signOut(tempAuth);
      } catch (e) {
        alert("Error creating user: " + e.message);
      }
    };

    // Logout
    window.logoutUser = () => {
      signOut(auth).then(() => {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login-box").classList.remove("hidden");
      });
    };

    function showDashboard(email, role) {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("user-email-display").innerText = email;
      document.getElementById("user-role-display").innerText = role.toUpperCase();

      if (role === "admin") {
        document.getElementById("admin-create-box").classList.remove("hidden");
      } else {
        document.getElementById("admin-create-box").classList.add("hidden");
      }

      loadCustomerList();
      setDefaultTxnDate();
    }

    // 3. Add New Customer
    window.addCustomer = async () => {
      const name = document.getElementById("customer-name").value.trim();
      const phone = document.getElementById("customer-phone").value.trim();

      if (!name || !phone) {
        alert("Please provide both name and mobile number!");
        return;
      }

      try {
        const newCustomerRef = push(ref(db, 'customers'));
        await set(newCustomerRef, {
          name: name,
          phone: phone,
          balance: 0,
          createdAt: Date.now()
        });
        alert("Customer added successfully!");
        document.getElementById("customer-name").value = "";
        document.getElementById("customer-phone").value = "";
        loadCustomerList();
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // 4. Load Customer List
    async function loadCustomerList() {
      const select = document.getElementById("customer-select");
      select.innerHTML = '<option value="">-- Select Customer --</option>';
      
      const snapshot = await get(child(ref(db), 'customers'));
      if (snapshot.exists()) {
        snapshot.forEach((childSnapshot) => {
          const customerId = childSnapshot.key;
          const data = childSnapshot.val();
          const option = document.createElement("option");
          option.value = customerId;
          option.textContent = `${data.name} (${data.phone})`;
          select.appendChild(option);
        });
      }
    }

    // 5. Load Customer Data
    window.loadCustomerData = async () => {
      const customerId = document.getElementById("customer-select").value;
      const detailsDiv = document.getElementById("customer-details");

      if (!customerId) {
        detailsDiv.style.display = "none";
        return;
      }

      detailsDiv.style.display = "block";
      setDefaultTxnDate();
      
      const snapshot = await get(ref(db, 'customers/' + customerId));
      if (snapshot.exists()) {
        const bal = snapshot.val().balance || 0;
        document.getElementById("current-balance").innerHTML = bal < 0 
          ? `<span style="color:red;">${bal} BDT (Loan)</span>` 
          : `<span style="color:#28a745;">${bal} BDT</span>`;
      }

      currentPage = 1;
      loadHistory(customerId);
    };

    // 6. Handle Transactions
    window.handleTransaction = async (type) => {
      const customerId = document.getElementById("customer-select").value;
      const amount = parseFloat(document.getElementById("txn-amount").value);
      const note = document.getElementById("txn-note").value.trim();
      const customDateVal = document.getElementById("txn-date").value;

      if (!amount || amount <= 0) {
        alert("Please enter a valid amount!");
        return;
      }

      const timestamp = customDateVal ? new Date(customDateVal).getTime() : Date.now();

      try {
        const custRef = ref(db, 'customers/' + customerId);
        const custSnapshot = await get(custRef);
        let currentBalance = custSnapshot.val().balance || 0;

        let newBalance = (type === 'deposit') ? currentBalance + amount : currentBalance - amount;

        await update(custRef, { balance: newBalance });

        const historyRef = ref(db, 'ledger_history');
        const newHistoryRef = push(historyRef);
        await set(newHistoryRef, {
          customerId: customerId,
          type: type,
          amount: amount,
          note: note || (type === 'deposit' ? 'Deposit' : 'Withdrawal'),
          timestamp: timestamp
        });

        alert("Transaction completed successfully!");
        document.getElementById("txn-amount").value = "";
        document.getElementById("txn-note").value = "";
        setDefaultTxnDate();
        loadCustomerData();
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // Filter functions
    window.applyDateFilter = () => {
      const customerId = document.getElementById("customer-select").value;
      if (customerId) {
        currentPage = 1; // Reset to page 1 on new filter
        loadHistory(customerId);
      }
    };

    window.resetDateFilter = () => {
      document.getElementById("filter-start-date").value = "";
      document.getElementById("filter-end-date").value = "";
      const customerId = document.getElementById("customer-select").value;
      if (customerId) {
        currentPage = 1; // Reset to page 1 on reset
        loadHistory(customerId);
      }
    };

    // Pagination Controls
    window.changePage = (direction) => {
      currentPage += direction;
      renderTablePage();
    };

    // 7. Load History & Filter Transactions
    async function loadHistory(customerId) {
      const historyBody = document.getElementById("history-body");
      const historyFooter = document.getElementById("history-footer");
      historyBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>`;
      historyFooter.innerHTML = "";

      const snapshot = await get(ref(db, 'ledger_history'));
      let transactions = [];
      if (snapshot.exists()) {
        snapshot.forEach((childSnapshot) => {
          let data = childSnapshot.val();
          data.id = childSnapshot.key;
          if (data.customerId === customerId) {
            transactions.push(data);
          }
        });
      }

      // Sort chronological (Oldest to Newest) to calculate running balance accurately
      transactions.sort((a, b) => a.timestamp - b.timestamp);

      let runningBalance = 0;
      transactions.forEach(data => {
        if (data.type === 'deposit') {
          runningBalance += data.amount;
        } else {
          runningBalance -= data.amount;
        }
        data.runningBalance = runningBalance;
      });

      // Sort Newest First
      transactions.sort((a, b) => b.timestamp - a.timestamp);

      // Get Date Filter Values
      const startDateVal = document.getElementById("filter-start-date").value;
      const endDateVal = document.getElementById("filter-end-date").value;

      allFilteredTransactions = transactions.filter(data => {
        if (!startDateVal && !endDateVal) return true;
        const txnDate = new Date(data.timestamp);
        
        if (startDateVal) {
          const startDate = new Date(startDateVal + "T00:00:00");
          if (txnDate < startDate) return false;
        }
        if (endDateVal) {
          const endDate = new Date(endDateVal + "T23:59:59");
          if (txnDate > endDate) return false;
        }
        return true;
      });

      renderTablePage();
    }

    // Render Table Page & Footer Summaries
    function renderTablePage() {
      const historyBody = document.getElementById("history-body");
      const historyFooter = document.getElementById("history-footer");
      historyBody.innerHTML = "";

      let totalDeposit = 0;
      let totalWithdrawal = 0;

      // Calculate totals for all filtered data (regardless of current page)
      allFilteredTransactions.forEach(data => {
        if (data.type === 'deposit') {
          totalDeposit += data.amount;
        } else {
          totalWithdrawal += data.amount;
        }
      });

      if (allFilteredTransactions.length > 0) {
        // Pagination slicing
        const totalPages = Math.ceil(allFilteredTransactions.length / rowsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * rowsPerPage;
        const paginatedItems = allFilteredTransactions.slice(startIdx, startIdx + rowsPerPage);

        paginatedItems.forEach(data => {
          const tr = document.createElement("tr");
          
          const dateObj = new Date(data.timestamp);
          const day = String(dateObj.getDate()).padStart(2, '0');
          const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const formattedDate = `${day}-${months[dateObj.getMonth()]} ${dateObj.getFullYear()} ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

          const typeLabel = data.type === 'deposit' ? 'Deposit' : 'Withdrawal';
          const amountColor = data.type === 'deposit' ? 'green' : 'red';
          const prefix = data.type === 'deposit' ? '+' : '-';

          let balanceDisplayHtml = data.runningBalance < 0 
            ? `<span style="color: red; font-weight: bold;">${data.runningBalance} BDT (Loan)</span>` 
            : `<span style="color: #333; font-weight: bold;">${data.runningBalance} BDT</span>`;

          const actionBtnHtml = (currentRole === "admin") 
            ? `<button class="btn-edit" onclick="editTransaction('${data.id}', '${data.note}', ${data.amount})">Edit</button>` 
            : `<span style="color:#aaa; font-size:0.8em;">No Access</span>`;

          tr.innerHTML = `
            <td>${formattedDate}</td>
            <td style="color: ${amountColor}; font-weight: bold;">${prefix}${data.amount} BDT (${typeLabel})</td>
            <td>${balanceDisplayHtml}</td>
            <td>${data.note}</td>
            <td style="text-align: center;">${actionBtnHtml}</td>
          `;
          historyBody.appendChild(tr);
        });

        // Update Pagination Controls UI
        document.getElementById("page-info").innerText = `Page ${currentPage} of ${totalPages}`;
        document.getElementById("prev-btn").disabled = currentPage === 1;
        document.getElementById("next-btn").disabled = currentPage === totalPages;

        // Add Sub Total Footer Row
        const netTotal = totalDeposit - totalWithdrawal;
        let netTotalDisplayHtml = netTotal < 0 
          ? `<span style="color: red;">Net Balance: ${netTotal} BDT (Loan)</span>` 
          : `<span style="color: #28a745;">Net Balance: ${netTotal} BDT</span>`;

        historyFooter.innerHTML = `
          <tr>
            <td>Sub Total</td>
            <td>
              <span style="color:green;">+${totalDeposit}</span> / 
              <span style="color:red;">-${totalWithdrawal}</span>
            </td>
            <td colspan="3" style="font-size: 1.05em;">
              ${netTotalDisplayHtml}
            </td>
          </tr>
        `;
      } else {
        historyBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No transaction history found for selected criteria.</td></tr>`;
        document.getElementById("page-info").innerText = `Page 1 of 1`;
        document.getElementById("prev-btn").disabled = true;
        document.getElementById("next-btn").disabled = true;
      }
    }

    // 8. Edit Transaction (Admin Only)
    window.editTransaction = async (txnId, oldNote, oldAmount) => {
      if (currentRole !== "admin") {
        alert("Permission Denied! Only Admin can edit transactions.");
        return;
      }

      const newNote = prompt("Edit Remarks / Note:", oldNote);
      if (newNote === null) return;

      const newAmountInput = prompt("Edit Amount:", oldAmount);
      if (newAmountInput === null) return;

      const newAmount = parseFloat(newAmountInput);
      if (isNaN(newAmount) || newAmount <= 0) {
        alert("Invalid amount!");
        return;
      }

      try {
        const txnRef = ref(db, 'ledger_history/' + txnId);
        await update(txnRef, {
          note: newNote,
          amount: newAmount
        });
        alert("Transaction updated successfully!");
        loadCustomerData();
      } catch (e) {
        alert("Update error: " + e.message);
      }
    };
  </script>
</body>
</html>
