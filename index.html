<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Transaction Ledger (Real-time)</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-hover: #0056b3;
      --success: #28a745;
      --success-hover: #218838;
      --danger: #dc3545;
      --danger-hover: #c82333;
      --warning: #ffc107;
      --warning-hover: #e0a800;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #ced4da;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px;
      max-width: 800px;
      margin: auto;
      background-color: var(--bg-color);
      color: var(--text-color);
      box-sizing: border-box;
    }

    .box {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    .section-header {
      background-color: #e9ecef;
      color: #333;
      padding: 12px 15px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      user-select: none;
    }
    .section-header:hover { background-color: #dde2e6; }
    .section-content { display: none; padding-top: 5px; }
    .section-content.active { display: block; }

    /* লেনদেন এবং হিস্টোরির আলাদা ট্যাব বাটন স্টাইল */
    .main-nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .nav-tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid var(--primary);
      background-color: #ffffff;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.2s;
      margin: 0;
    }
    .nav-tab-btn.active-tab {
      background-color: var(--primary);
      color: #ffffff;
    }
    .nav-tab-btn:hover:not(.active-tab) {
      background-color: #eef6ff;
    }

    h2, h3 { color: var(--text-color); font-size: 1.3em; margin-top: 0; }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      font-size: 16px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover { background-color: var(--primary-hover); }

    .btn-deposit { background-color: var(--success); }
    .btn-deposit:hover { background-color: var(--success-hover); }

    .btn-withdraw { background-color: var(--danger); }
    .btn-withdraw:hover { background-color: var(--danger-hover); }

    .btn-edit { background-color: var(--warning); color: #333; padding: 6px 10px; width: auto; font-size: 0.8em; margin-right: 4px; }
    .btn-edit:hover { background-color: var(--warning-hover); }

    .btn-delete { background-color: var(--danger); color: white; padding: 6px 10px; width: auto; font-size: 0.8em; }
    .btn-delete:hover { background-color: var(--danger-hover); }

    .btn-filter { background-color: #17a2b8; width: 48%; display: inline-block; }
    .btn-filter:hover { background-color: #138496; }

    .btn-reset { background-color: #6c757d; width: 48%; display: inline-block; }
    .btn-reset:hover { background-color: #5a6268; }

    .balance-card {
      background: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 1.1em;
      font-weight: bold;
      margin: 10px 0;
    }

    .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 580px; }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; font-size: 0.85em; word-break: break-word; vertical-align: top; }
    th { background-color: #f8f9fa; color: #333; }
    tfoot tr { background-color: #e9ecef; font-weight: bold; }

    /* লেনদেনের বিবরণ কলামের সার্চ বক্স */
    .note-search-input {
      width: 100%;
      padding: 6px 8px;
      margin: 0 0 6px 0;
      font-size: 0.85em;
      border: 1px solid #adb5bd;
      border-radius: 4px;
      background-color: #ffffff;
    }

    .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    .pagination-container button { width: auto; padding: 8px 15px; margin: 0; font-size: 0.9em; }
    .pagination-container button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #page-info { font-size: 0.9em; font-weight: bold; color: #555; }

    .hidden { display: none !important; }
    .logout-btn { background-color: #6c757d; width: auto; padding: 6px 12px; float: right; font-size: 0.9em; }
    .admin-section { border: 2px dashed var(--primary); background-color: #eef6ff; }
    .filter-container { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
    .date-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
    .date-inputs div { flex: 1; min-width: 140px; }
    .date-inputs label { font-size: 0.85em; font-weight: bold; color: #555; }
  </style>
</head>
<body>

  <!-- লগইন ফর্ম -->
  <div id="login-box" class="box">
    <h3>System Login</h3>
    <input type="email" id="login-email" placeholder="Email Address">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="loginUser()">Login</button>
  </div>

  <!-- মেইন ড্যাশবোর্ড -->
  <div id="dashboard" class="hidden">
    <div class="box">
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
      <h2>ব্যক্তিগত হিসাব</h2>
      <p>Logged in User: <span id="user-email-display" style="font-weight: bold;"></span> (<span id="user-role-display" style="color:var(--primary); font-weight:bold;"></span>)</p>
    </div>

    <!-- শুধুমাত্র এডমিনের জন্য: নতুন ইউজার তৈরি করার সেকশন -->
    <div id="admin-create-container" class="hidden">
      <div class="section-header" onclick="toggleSection('admin-create-content')">
        <span>➕ Add New User (Admin Only)</span> <span>▼</span>
      </div>
      <div id="admin-create-content" class="box admin-section section-content">
        <input type="email" id="reg-email" placeholder="User Email Address">
        <input type="password" id="reg-password" placeholder="Set Password (min 6 chars)">
        <select id="reg-role">
          <option value="staff">Staff (Cannot edit history or create users)</option>
          <option value="admin">Admin (Full access)</option>
        </select>
        <button onclick="registerUserByAdmin()" class="btn-deposit">Create User</button>
      </div>
    </div>

    <!-- ১. নতুন অ্যাকাউন্ট হোল্ডার যোগ করার ফর্ম -->
    <div>
      <div class="section-header" onclick="toggleSection('add-customer-content')">
        <span>👤 নতুন হিসাব খুলুন</span> <span>▼</span>
      </div>
      <div id="add-customer-content" class="box section-content">
        <input type="text" id="customer-name" placeholder="Account Holder Name">
        <input type="text" id="customer-phone" placeholder="Mobile Number">
        <button onclick="addCustomer()">নতুন হিসাব সংরক্ষণ</button>
      </div>
    </div>

    <!-- ২. আলাদা দুটি বাটন: লেনদেন করুন এবং লেনদেন হিস্টরি -->
    <div class="main-nav-buttons">
      <button id="btn-tab-txn" class="nav-tab-btn active-tab" onclick="switchMainTab('txn')">💳 লেনদেন করুন</button>
      <button id="btn-tab-history" class="nav-tab-btn" onclick="switchMainTab('history')">📊 লেনদেন হিস্টরি</button>
    </div>

    <!-- ট্যাব ১: শুধুমাত্র লেনদেন (জমা/খরচ) ও ব্যালেন্স সেকশন -->
    <div id="transaction-tab-panel" class="box">
      <label for="customer-select-txn" style="font-weight: bold;">হিসাব নির্বাচন করুন:</label>
      <select id="customer-select-txn" onchange="syncAndLoadCustomer(this.value)">
        <option value="">-- নির্বাচন করুন --</option>
      </select>

      <div id="customer-txn-details" style="display:none;">
        <div class="balance-card">
          Current Balance: <span id="current-balance" style="color:var(--success);">0</span> BDT
        </div>

        <label for="txn-date" style="font-size: 0.85em; font-weight: bold; color: #555;">Transaction Date & Time:</label>
        <input type="datetime-local" id="txn-date">

        <input type="number" id="txn-amount" placeholder="টাকা">
        <input type="text" id="txn-note" placeholder="লেনদেনের বিবরণ লিখুন">

        <div style="display: flex; gap: 10px;">
          <button class="btn-deposit" onclick="handleTransaction('deposit')">জমা(+)</button>
          <button class="btn-withdraw" onclick="handleTransaction('withdraw')">খরচ(-)</button>
        </div>
      </div>
    </div>

    <!-- ট্যাব ২: শুধুমাত্র ট্রানজেকশন হিস্টোরি এবং রিপোর্ট সেকশন -->
    <div id="history-tab-panel" class="box hidden">
      <label for="customer-select-history" style="font-weight: bold;">হিসাব নির্বাচন করুন:</label>
      <select id="customer-select-history" onchange="syncAndLoadCustomer(this.value)">
        <option value="">-- নির্বাচন করুন --</option>
      </select>

      <div id="customer-history-details" style="display:none; margin-top: 10px;">
        <!-- তারিখ ফিল্টার করার বক্স -->
        <div class="filter-container">
          <div class="date-inputs">
            <div>
              <label for="filter-start-date">From Date:</label>
              <input type="date" id="filter-start-date">
            </div>
            <div>
              <label for="filter-end-date">To Date:</label>
              <input type="date" id="filter-end-date">
            </div>
          </div>
          <div style="margin-top: 5px;">
            <button class="btn-filter" onclick="applyFilters()">Filter Report</button>
            <button class="btn-reset" onclick="resetAllFilters()">Reset</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>তারিখ</th>
                <th>লেনদেনের পরিমাণ</th>
                <th>অবশিষ্ট ব্যালেন্স</th>
                <th>
                  <input type="text" id="filter-note-text" class="note-search-input" placeholder="🔍 বিবরণ লিখুন..." oninput="applyFilters()">
                  <div>লেনদেনের বিবরণ</div>
                </th>
                <th>অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <!-- ডাইনামিক ডাটা এখানে লোড হবে -->
            </tbody>
            <tfoot id="history-footer">
              <!-- মোট হিসাব বা সাব-টোটাল এখানে দেখাবে -->
            </tfoot>
          </table>
        </div>

        <!-- পেজিনেশন বাটন (ফিল্টার না থাকলে দেখাবে) -->
        <div class="pagination-container" id="pagination-wrapper">
          <button id="prev-btn" onclick="changePage(-1)">Previous</button>
          <span id="page-info">Page 1 of 1</span>
          <button id="next-btn" onclick="changePage(1)">Next</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase SDK মডিউল ইম্পোর্ট -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgEiJJHwtdhd4QzZRonoyHEwmz1vjYN-U",
      authDomain: "shifat30373transaction.firebaseapp.com",
      databaseURL: "https://shifat30373transaction-default-rtdb.firebaseio.com",
      projectId: "shifat30373transaction",
      storageBucket: "shifat30373transaction.firebasestorage.app",
      messagingSenderId: "38889296928",
      appId: "1:38889296928:web:427556520b470b71ccd845",
      measurementId: "G-ZDZ471PKXE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentRole = "staff";
    let currentUser = null;
    let selectedCustomerId = "";

    let allCustomerTransactions = [];
    let allFilteredTransactions = [];
    let currentPage = 1;
    const rowsPerPage = 5;
    let unsubscribeBalance = null;
    let unsubscribeHistory = null;

    // উপরে থাকা কলাপসিবল সেকশন (Add User / Add Customer) টগল করা
    window.toggleSection = (contentId) => {
      const content = document.getElementById(contentId);
      content.classList.toggle('active');
    };

    // আলাদা দুটি মেইন বাটনের মাধ্যমে সেকশন পরিবর্তন (একটার ভেতর আরেকটা ঢুকবে না)
    window.switchMainTab = (tabName) => {
      const txnPanel = document.getElementById("transaction-tab-panel");
      const historyPanel = document.getElementById("history-tab-panel");
      const btnTxn = document.getElementById("btn-tab-txn");
      const btnHistory = document.getElementById("btn-tab-history");

      if (tabName === 'txn') {
        txnPanel.classList.remove("hidden");
        historyPanel.classList.add("hidden");
        btnTxn.classList.add("active-tab");
        btnHistory.classList.remove("active-tab");
      } else {
        txnPanel.classList.add("hidden");
        historyPanel.classList.remove("hidden");
        btnTxn.classList.remove("active-tab");
        btnHistory.classList.add("active-tab");
      }
    };

    function setDefaultTxnDate() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("txn-date").value = now.toISOString().slice(0, 16);
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const userRef = ref(db, 'users/' + user.uid);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          currentRole = snapshot.val().role || "staff";
          showDashboard(user.email, currentRole);
        } else {
          const usersRef = ref(db, 'users');
          const allUsersSnap = await get(usersRef);

          let assignedRole = allUsersSnap.exists() ? "staff" : "admin";
          await set(userRef, {
            email: user.email,
            role: assignedRole,
            createdAt: Date.now()
          });
          currentRole = assignedRole;
          showDashboard(user.email, currentRole);
        }
      } else {
        currentUser = null;
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login-box").classList.remove("hidden");
      }
    });

    window.loginUser = async () => {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();

      if (!email || !password) {
        alert("Please enter both email address and password!");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        alert("Login Error: " + e.message);
      }
    };

    window.registerUserByAdmin = async () => {
      if (currentRole !== "admin") {
        alert("Permission denied! Only Admin can create new users.");
        return;
      }

      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value.trim();
      const role = document.getElementById("reg-role").value;

      if (!email || !password) {
        alert("Please fill in all fields!");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters!");
        return;
      }

      try {
        const tempApp = initializeApp(firebaseConfig, "SecondaryApp");
        const tempAuth = getAuth(tempApp);
        const userCredential = await createUserWithEmailAndPassword(tempAuth, email, password);
        const newUser = userCredential.user;

        await set(ref(db, 'users/' + newUser.uid), {
          email: email,
          role: role,
          createdAt: Date.now()
        });

        alert(`New User (${email}) with role [${role.toUpperCase()}] created successfully!`);
        document.getElementById("reg-email").value = "";
        document.getElementById("reg-password").value = "";
        
        signOut(tempAuth);
      } catch (e) {
        alert("Error creating user: " + e.message);
      }
    };

    window.logoutUser = () => {
      signOut(auth).then(() => {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login-box").classList.remove("hidden");
      });
    };

    function showDashboard(email, role) {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("user-email-display").innerText = email;
      document.getElementById("user-role-display").innerText = role.toUpperCase();

      if (role === "admin") {
        document.getElementById("admin-create-container").classList.remove("hidden");
      } else {
        document.getElementById("admin-create-container").classList.add("hidden");
      }

      loadCustomerListRealtime();
      setDefaultTxnDate();
    }

    window.addCustomer = async () => {
      const name = document.getElementById("customer-name").value.trim();
      const phone = document.getElementById("customer-phone").value.trim();

      if (!name || !phone) {
        alert("Please provide both name and mobile number!");
        return;
      }

      try {
        const newCustomerRef = push(ref(db, 'customers'));
        await set(newCustomerRef, {
          name: name,
          phone: phone,
          balance: 0,
          createdAt: Date.now()
        });
        alert("Customer added successfully!");
        document.getElementById("customer-name").value = "";
        document.getElementById("customer-phone").value = "";
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // উভয় ট্যাবের কাস্টমার ড্রপডাউন রিয়েল-টাইমে আপডেট রাখা
    function loadCustomerListRealtime() {
      const selectTxn = document.getElementById("customer-select-txn");
      const selectHistory = document.getElementById("customer-select-history");
      const customersRef = ref(db, 'customers');

      onValue(customersRef, (snapshot) => {
        const optionsHtml = ['<option value="">-- নির্বাচন করুন --</option>'];

        if (snapshot.exists()) {
          snapshot.forEach((childSnapshot) => {
            const customerId = childSnapshot.key;
            const data = childSnapshot.val();
            optionsHtml.push(`<option value="${customerId}">${data.name} (${data.phone})</option>`);
          });
        }

        const joinedOptions = optionsHtml.join("");
        selectTxn.innerHTML = joinedOptions;
        selectHistory.innerHTML = joinedOptions;

        selectTxn.value = selectedCustomerId;
        selectHistory.value = selectedCustomerId;
      });
    }

    // যেকোনো ড্রপডাউন থেকে কাস্টমার সিলেক্ট করলে দুটিই সিঙ্ক হবে এবং ডাটা লোড হবে
    window.syncAndLoadCustomer = (customerId) => {
      selectedCustomerId = customerId;
      document.getElementById("customer-select-txn").value = customerId;
      document.getElementById("customer-select-history").value = customerId;

      const txnDetailsDiv = document.getElementById("customer-txn-details");
      const historyDetailsDiv = document.getElementById("customer-history-details");

      if (unsubscribeBalance) unsubscribeBalance();
      if (unsubscribeHistory) unsubscribeHistory();

      if (!customerId) {
        txnDetailsDiv.style.display = "none";
        historyDetailsDiv.style.display = "none";
        allCustomerTransactions = [];
        allFilteredTransactions = [];
        return;
      }

      txnDetailsDiv.style.display = "block";
      historyDetailsDiv.style.display = "block";
      setDefaultTxnDate();

      // রিয়েল-টাইম ব্যালেন্স আপডেট
      const custRef = ref(db, 'customers/' + customerId);
      unsubscribeBalance = onValue(custRef, (snapshot) => {
        if (snapshot.exists()) {
          const bal = snapshot.val().balance || 0;
          document.getElementById("current-balance").innerHTML = bal < 0 
            ? `<span style="color:red;">${bal} BDT (Loan)</span>` 
            : `<span style="color:var(--success);">${bal} BDT</span>`;
        }
      });

      currentPage = 1;
      loadHistoryRealtime(customerId);
    };

    window.handleTransaction = async (type) => {
      const customerId = selectedCustomerId;
      const amount = parseFloat(document.getElementById("txn-amount").value);
      const note = document.getElementById("txn-note").value.trim();
      const customDateVal = document.getElementById("txn-date").value;

      if (!customerId) {
        alert("Please select a customer first!");
        return;
      }

      if (!amount || amount <= 0) {
        alert("Please enter a valid amount!");
        return;
      }

      const timestamp = customDateVal ? new Date(customDateVal).getTime() : Date.now();

      try {
        const custRef = ref(db, 'customers/' + customerId);
        const custSnapshot = await get(custRef);
        let currentBalance = custSnapshot.val().balance || 0;

        let newBalance = (type === 'deposit') ? currentBalance + amount : currentBalance - amount;

        await update(custRef, { balance: newBalance });

        const historyRef = ref(db, 'ledger_history');
        const newHistoryRef = push(historyRef);
        await set(newHistoryRef, {
          customerId: customerId,
          type: type,
          amount: amount,
          note: note || (type === 'deposit' ? 'Deposit' : 'Withdrawal'),
          timestamp: timestamp
        });

        alert("Transaction completed successfully!");
        document.getElementById("txn-amount").value = "";
        document.getElementById("txn-note").value = "";
        setDefaultTxnDate();
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // তারিখ এবং বিবরণ (Note) অনুযায়ী ফিল্টার প্রয়োগ
    window.applyFilters = () => {
      currentPage = 1;
      filterAndRenderTransactions();
    };

    // সব ফিল্টার রিসেট করে ডিফল্ট পেজিনেশন অবস্থায় ফিরিয়ে আনা
    window.resetAllFilters = () => {
      document.getElementById("filter-start-date").value = "";
      document.getElementById("filter-end-date").value = "";
      document.getElementById("filter-note-text").value = "";
      currentPage = 1;
      filterAndRenderTransactions();
    };

    window.changePage = (direction) => {
      currentPage += direction;
      renderTablePage();
    };

    function loadHistoryRealtime(customerId) {
      if (unsubscribeHistory) unsubscribeHistory();

      const historyBody = document.getElementById("history-body");
      const historyFooter = document.getElementById("history-footer");
      historyBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>`;
      historyFooter.innerHTML = "";

      const historyRef = ref(db, 'ledger_history');
      unsubscribeHistory = onValue(historyRef, (snapshot) => {
        let transactions = [];
        if (snapshot.exists()) {
          snapshot.forEach((childSnapshot) => {
            let data = childSnapshot.val();
            data.id = childSnapshot.key;
            if (data.customerId === customerId) {
              transactions.push(data);
            }
          });
        }

        // পুরনো থেকে নতুন সাজিয়ে প্রতিটি লেনদেনের পরের অবশিষ্ট ব্যালেন্স হিসাব
        transactions.sort((a, b) => a.timestamp - b.timestamp);

        let runningBalance = 0;
        transactions.forEach(data => {
          if (data.type === 'deposit') {
            runningBalance += data.amount;
          } else {
            runningBalance -= data.amount;
          }
          data.runningBalance = runningBalance;
        });

        // নতুন লেনদেনগুলো উপরে রাখা
        transactions.sort((a, b) => b.timestamp - a.timestamp);
        allCustomerTransactions = transactions;

        filterAndRenderTransactions();
      });
    }

    function filterAndRenderTransactions() {
      const startDateVal = document.getElementById("filter-start-date").value;
      const endDateVal = document.getElementById("filter-end-date").value;
      const noteSearchVal = document.getElementById("filter-note-text").value.trim().toLowerCase();

      allFilteredTransactions = allCustomerTransactions.filter(data => {
        const txnDate = new Date(data.timestamp);

        if (startDateVal) {
          const startDate = new Date(startDateVal + "T00:00:00");
          if (txnDate < startDate) return false;
        }
        if (endDateVal) {
          const endDate = new Date(endDateVal + "T23:59:59");
          if (txnDate > endDate) return false;
        }
        if (noteSearchVal) {
          const noteText = (data.note || "").toLowerCase();
          if (!noteText.includes(noteSearchVal)) return false;
        }
        return true;
      });

      renderTablePage();
    }

    function renderTablePage() {
      const historyBody = document.getElementById("history-body");
      const historyFooter = document.getElementById("history-footer");
      const paginationWrapper = document.getElementById("pagination-wrapper");
      historyBody.innerHTML = "";

      let totalDeposit = 0;
      let totalWithdrawal = 0;

      allFilteredTransactions.forEach(data => {
        if (data.type === 'deposit') {
          totalDeposit += data.amount;
        } else {
          totalWithdrawal += data.amount;
        }
      });

      const startDateVal = document.getElementById("filter-start-date").value;
      const endDateVal = document.getElementById("filter-end-date").value;
      const noteSearchVal = document.getElementById("filter-note-text").value.trim();
      const isFiltered = (startDateVal !== "" || endDateVal !== "" || noteSearchVal !== "");

      if (allFilteredTransactions.length > 0) {
        let itemsToDisplay = [];

        if (isFiltered) {
          // ফিল্টারিং চালু থাকলে কোনো পেজিনেশন থাকবে না, সব ফলাফল একসাথে দেখাবে
          itemsToDisplay = allFilteredTransactions;
          paginationWrapper.style.display = "none";
        } else {
          // ফিল্টার না থাকলে পেজিনেশন দেখাবে
          paginationWrapper.style.display = "flex";
          const totalPages = Math.ceil(allFilteredTransactions.length / rowsPerPage);
          if (currentPage > totalPages) currentPage = totalPages;
          if (currentPage < 1) currentPage = 1;

          const startIdx = (currentPage - 1) * rowsPerPage;
          itemsToDisplay = allFilteredTransactions.slice(startIdx, startIdx + rowsPerPage);

          document.getElementById("page-info").innerText = `Page ${currentPage} of ${totalPages}`;
          document.getElementById("prev-btn").disabled = currentPage === 1;
          document.getElementById("next-btn").disabled = currentPage === totalPages;
        }

        itemsToDisplay.forEach(data => {
          const tr = document.createElement("tr");
          
          const dateObj = new Date(data.timestamp);
          const day = String(dateObj.getDate()).padStart(2, '0');
          const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const formattedDate = `${day}-${months[dateObj.getMonth()]} ${dateObj.getFullYear()} ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

          const typeLabel = data.type === 'deposit' ? 'Deposit' : 'Withdrawal';
          const amountColor = data.type === 'deposit' ? 'green' : 'red';
          const prefix = data.type === 'deposit' ? '+' : '-';

          let balanceDisplayHtml = data.runningBalance < 0 
            ? `<span style="color: red; font-weight: bold;">${data.runningBalance} BDT (Loan)</span>` 
            : `<span style="color: #333; font-weight: bold;">${data.runningBalance} BDT</span>`;

          const safeNote = (data.note || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

          const actionBtnHtml = (currentRole === "admin") 
            ? `<button class="btn-edit" onclick="editTransaction('${data.id}', '${safeNote}', ${data.amount}, '${data.type}', '${data.customerId}', ${data.timestamp})">Edit</button>` +
              `<button class="btn-delete" onclick="deleteTransaction('${data.id}', ${data.amount}, '${data.type}', '${data.customerId}')">Delete</button>`
            : `<span style="color:#aaa; font-size:0.8em;">No Access</span>`;

          tr.innerHTML = `
            <td>${formattedDate}</td>
            <td style="color: ${amountColor}; font-weight: bold;">${prefix}${data.amount} BDT (${typeLabel})</td>
            <td>${balanceDisplayHtml}</td>
            <td>${data.note}</td>
            <td style="text-align: center;">${actionBtnHtml}</td>
          `;
          historyBody.appendChild(tr);
        });

        const netTotal = totalDeposit - totalWithdrawal;
        let netTotalDisplayHtml = netTotal < 0 
          ? `<span style="color: red;">Net Balance: ${netTotal} BDT (Loan)</span>` 
          : `<span style="color: var(--success);">Net Balance: ${netTotal} BDT</span>`;

        historyFooter.innerHTML = `
          <tr>
            <td>Sub Total</td>
            <td>
              <span style="color:green;">+${totalDeposit}</span> / 
              <span style="color:red;">-${totalWithdrawal}</span>
            </td>
            <td colspan="3" style="font-size: 1.05em;">
              ${netTotalDisplayHtml}
            </td>
          </tr>
        `;
      } else {
        paginationWrapper.style.display = "none";
        historyFooter.innerHTML = "";
        historyBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No transaction history found for selected criteria.</td></tr>`;
      }
    }

    window.editTransaction = async (txnId, oldNote, oldAmount, txnType, customerId, oldTimestamp) => {
      if (currentRole !== "admin") {
        alert("Permission Denied! Only Admin can edit transactions.");
        return;
      }

      const newNote = prompt("Edit Remarks / Note:", oldNote);
      if (newNote === null) return;

      const newAmountInput = prompt("Edit Amount:", oldAmount);
      if (newAmountInput === null) return;

      const newAmount = parseFloat(newAmountInput);
      if (isNaN(newAmount) || newAmount <= 0) {
        alert("Invalid amount!");
        return;
      }

      const d = new Date(oldTimestamp);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      const defaultDateStr = d.toISOString().slice(0, 16);

      const newDateInput = prompt("Edit Date & Time (YYYY-MM-DDTHH:mm):", defaultDateStr);
      if (newDateInput === null) return;

      const newTimestamp = new Date(newDateInput).getTime();
      if (isNaN(newTimestamp)) {
        alert("Invalid date and time format!");
        return;
      }

      try {
        const custRef = ref(db, 'customers/' + customerId);
        const custSnapshot = await get(custRef);
        let currentBalance = custSnapshot.val().balance || 0;

        let balanceAdjustment = 0;
        if (txnType === 'deposit') {
          balanceAdjustment = newAmount - oldAmount;
        } else {
          balanceAdjustment = oldAmount - newAmount;
        }
        let updatedBalance = currentBalance + balanceAdjustment;

        await update(custRef, { balance: updatedBalance });

        const txnRef = ref(db, 'ledger_history/' + txnId);
        await update(txnRef, {
          note: newNote,
          amount: newAmount,
          timestamp: newTimestamp
        });

        alert("Transaction updated successfully!");
      } catch (e) {
        alert("Update error: " + e.message);
      }
    };

    window.deleteTransaction = async (txnId, amount, txnType, customerId) => {
      if (currentRole !== "admin") {
        alert("Permission Denied! Only Admin can delete transactions.");
        return;
      }

      if (!confirm("Are you sure you want to delete this transaction?")) {
        return;
      }

      try {
        const custRef = ref(db, 'customers/' + customerId);
        const custSnapshot = await get(custRef);
        let currentBalance = custSnapshot.val().balance || 0;

        let updatedBalance = (txnType === 'deposit') ? currentBalance - amount : currentBalance + amount;

        await update(custRef, { balance: updatedBalance });
        await remove(ref(db, 'ledger_history/' + txnId));

        alert("Transaction deleted successfully!");
      } catch (e) {
        alert("Delete error: " + e.message);
      }
    };
  </script>
</body>
